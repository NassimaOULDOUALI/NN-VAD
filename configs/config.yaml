# ======================================================================
# Central config — no hardcoded paths anywhere else in the codebase.
# ======================================================================
seed: 42

paths:
  provided_data: data/vad_data          # provided .wav/.json (NOT versioned)
  musan:         data/musan             # public noise
  rirs:          data/rirs              # public room impulse responses
  checkpoints:   checkpoints
  report_figs:   report/figures

audio:
  sample_rate: 16000
  mono: true

features:
  type: logmel
  n_mels: 64
  win_ms: 25
  hop_ms: 10                            # -> 100 frames/s
  cmvn: causal                          # streaming-safe normalisation

labels:
  frame_hop_ms: 10
  merge_gaps_below_ms: 50               # merge word-level micro-gaps (design choice)

split:
  by: speaker                           # speaker-disjoint
  train: 0.8
  val:   0.1
  test:  0.1
  heldout_noise_types: [babble]         # noise types reserved for test
  heldout_snr_db: [-5, 0]               # SNRs reserved for test

augment:
  snr_db_range: [-5, 20]
  p_noise: 0.8
  p_reverb: 0.5
  p_gain: 0.5
  specaugment: true

model:
  name: crnn                            # crnn | tcn
  crnn: {channels: 64, n_blocks: 4, kernel_size: 5, gru_hidden: 64, gru_layers: 1, dropout: 0.1}
  tcn:  {channels: [64, 64, 64, 64], kernel_size: 3, causal: true}

train:
  loss: weighted_bce                    # weighted_bce | focal
  optimizer: adamw
  lr: 1.0e-3
  scheduler: plateau
  batch_size: 32
  seq_seconds: 8
  max_epochs: 50
  early_stopping: {monitor: val_f1, mode: max, patience: 5}
  fp16: true

postprocess:
  smooth_median_ms: 90
  min_speech_ms: 120
  min_silence_ms: 100
  hangover_ms: 80

eval:
  threshold_selection: max_f1           # chosen on val, never on test
  collar_ms: 100
  snr_sweep_db: [-5, 0, 5, 10, 15, 20]
  baselines: [energy, silero]
